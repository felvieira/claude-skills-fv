# docker-compose.override.yml — Dev overrides (auto-loaded locally, git-ignored em prod)
#
# Este arquivo é carregado automaticamente pelo docker compose em dev.
# Em CI/prod: `docker compose -f docker-compose.yml up` (sem override).
#
# Adiciona: Adminer (DB GUI), Redis Commander, Mailpit (SMTP fake), hot reload.

services:
  app:
    build:
      target: dev                        # multi-stage: dev target com tsx watch
    command: npm run dev
    volumes:
      - ./apps/web:/app                  # hot reload via bind mount
      - /app/node_modules                # preserva node_modules do container
    environment:
      NODE_ENV: development
      BETTER_AUTH_URL: http://localhost:3000

  # ─────────────────────────────────────────────
  # DB GUI (dev only)
  # ─────────────────────────────────────────────
  adminer:
    image: adminer:4
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - internal

  # ─────────────────────────────────────────────
  # Redis GUI (dev only)
  # ─────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD}"
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - internal

  # ─────────────────────────────────────────────
  # Fake SMTP (dev only) — captura emails sem enviar
  # ─────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - internal

  # ─────────────────────────────────────────────
  # MinIO client init (cria bucket na 1ª vez)
  # ─────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
        mc mb --ignore-existing local/${STORAGE_BUCKET:-uploads};
        mc anonymous set download local/${STORAGE_BUCKET:-uploads}/public;
        exit 0;
      "
    networks:
      - internal
