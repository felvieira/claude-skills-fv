name: Validate Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Validate hooks.json
        run: node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json', 'utf-8')); console.log('✅ hooks/hooks.json is valid JSON')"

      - name: Validate config.json
        run: node -e "JSON.parse(require('fs').readFileSync('hooks/config.json', 'utf-8')); console.log('✅ hooks/config.json is valid JSON')"

      - name: Validate plugin.json
        run: |
          if [ -f ".claude-plugin/plugin.json" ]; then
            node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json', 'utf-8')); console.log('✅ plugin.json is valid JSON')"
          else
            echo "⚠️ plugin.json not found — skipping"
          fi

      - name: Check hook script references exist
        run: |
          node -e "
            const hooks = JSON.parse(require('fs').readFileSync('hooks/hooks.json', 'utf-8'));
            const fs = require('fs');
            let missing = 0;
            for (const [event, scripts] of Object.entries(hooks)) {
              for (const script of scripts) {
                if (!fs.existsSync(script)) {
                  console.error('❌ Missing: ' + script + ' (referenced in ' + event + ')');
                  missing++;
                }
              }
            }
            if (missing > 0) {
              console.error(missing + ' hook script(s) missing');
              process.exit(1);
            }
            console.log('✅ All hook scripts exist');
          "

      - name: Syntax check hook scripts
        run: |
          errors=0
          for file in hooks/scripts/*.mjs; do
            if node --check "$file" 2>/dev/null; then
              echo "✅ $file"
            else
              echo "❌ $file has syntax errors"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors file(s) with syntax errors"
            exit 1
          fi
          echo "✅ All hook scripts pass syntax check"

      - name: Validate agents array in plugin.json
        run: |
          node -e "
            const fs = require('fs');
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf-8'));
            const agents = plugin.agents || [];
            let missing = 0;
            for (const agentPath of agents) {
              if (!fs.existsSync(agentPath)) {
                console.error('❌ Missing agent file: ' + agentPath);
                missing++;
              } else {
                console.log('✅ ' + agentPath);
              }
            }
            if (missing > 0) {
              console.error(missing + ' agent file(s) missing');
              process.exit(1);
            }
            console.log('✅ All ' + agents.length + ' agent files exist');
          "

      - name: Build MCP server (for test scripts)
        working-directory: mcp-server
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
            npm run build --if-present
          fi

      - name: Run test scripts
        run: |
          errors=0
          for test in scripts/test-*.mjs; do
            [ -f "$test" ] || continue
            echo "▶ $test"
            if node "$test"; then
              echo "✅ $test"
            else
              echo "❌ $test failed"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors test script(s) failed"
            exit 1
          fi
          echo "✅ All test scripts passed"

      - name: Run consistency check
        run: node scripts/check-consistency.mjs

      - name: Validate agent frontmatter
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const agentDir = '.claude/agents';
            if (!fs.existsSync(agentDir)) {
              console.log('⚠️ No .claude/agents/ directory found — skipping');
              process.exit(0);
            }
            const files = fs.readdirSync(agentDir).filter(f => f.endsWith('.md'));
            let errors = 0;
            for (const file of files) {
              const content = fs.readFileSync(path.join(agentDir, file), 'utf-8');
              const hasFrontmatter = content.startsWith('---');
              const hasName = /^name:\s+\S/m.test(content);
              const hasDescription = /^description:\s+\S/m.test(content);
              const hasTools = /^tools:\s+\S/m.test(content);
              if (!hasFrontmatter || !hasName || !hasDescription || !hasTools) {
                console.error('❌ ' + file + ' missing required frontmatter (name, description, tools)');
                errors++;
              } else {
                console.log('✅ ' + file);
              }
            }
            if (errors > 0) process.exit(1);
            console.log('✅ All agent frontmatter valid');
          "
