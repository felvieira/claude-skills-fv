name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Run Python tests
        run: pytest scripts/tests -q

      - name: Run consistency check
        run: node scripts/check-consistency.mjs

      - name: Memory hooks tests (redaction, compaction recovery, learned-skill states)
        run: node --test scripts/tests/memory-hooks.test.mjs

      - name: Guards (/careful, /freeze) and trigger-eval train/test tests
        run: node --test scripts/tests/guards-evals.test.mjs

      - name: Install and prove the motion-film render stack (ffmpeg + Playwright + Chromium)
        run: node skills/86-code-motion-film/scripts/doctor.mjs --install --with-deps
        timeout-minutes: 15

      - name: Skills 85/86 tests (icon linter/exporter, springs, audio synth, doctor and a real render)
        run: node --test scripts/tests/skills-85-86.test.mjs

      - name: Subagent conduct block (agents match policies/subagent-conduct.md)
        run: node --test scripts/tests/agents-conduct.test.mjs

      - name: Skill 84 briefing engine and prompt library

        run: node --test scripts/tests/skill-84.test.mjs

      - name: Skill 86 film tools (determinism check, beat analysis, frame ranges)

        run: node --test scripts/tests/skill-86-film-tools.test.mjs scripts/tests/skill-86-fx.test.mjs

      - name: Memory injection eval (positives carry the answer, negatives inject zero)
        run: node scripts/eval-memory-recall.mjs --strict

      - name: Validate skill I/O schemas
        run: node scripts/validate-schema.mjs --all schemas/skill-io/

      # O kit em si não tem UI de produto; roda em --warn para provar que os
      # checkers executam sem erro. Em repo consumidor, rodar sem --warn.
      - name: Run design checkers (self-check)
        run: |
          node scripts/check-design-generic.mjs --warn templates/
          node scripts/check-contrast.mjs --warn templates/

      - name: Run installer smoke test
        run: bash scripts/smoke-install.sh

      - name: Install MCP server dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build MCP server
        working-directory: mcp-server
        run: npm run build

      - name: Run MCP server unit tests (cross-call dedup)
        working-directory: mcp-server
        run: npm test

      - name: Run MCP runtime boot check (real stdio JSON-RPC round trip)
        run: node scripts/verify-mcp-runtime.mjs

      - name: Run bench regression gate
        run: node bench/check-regression.mjs --max-drop=5

      - name: Run harness coherence check
        run: node scripts/check-harness-coherence.mjs
