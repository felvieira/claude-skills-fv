name: Cross-OS

# O kit promete funcionar em Windows, macOS e Linux. O workflow "Validate" roda em Ubuntu; este roda as suites que
# dependem de sistema (hooks, guardas, doctor de dependencias, render real, analise de audio) em macOS e Windows.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cross-os:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Memory hooks, guards and trigger-eval tests
        run: node --test scripts/tests/memory-hooks.test.mjs scripts/tests/guards-evals.test.mjs

      - name: Subagent conduct, briefing engine and effects (pure Node)
        run: node --test scripts/tests/agents-conduct.test.mjs scripts/tests/skill-84.test.mjs scripts/tests/skill-86-fx.test.mjs

      - name: Install and prove the motion-film render stack (ffmpeg + Playwright + Chromium)
        run: node skills/86-code-motion-film/scripts/doctor.mjs --install
        timeout-minutes: 25

      - name: Skills 85/86 tests and film tools (determinism check, beat analysis, real render)
        run: node --test scripts/tests/skills-85-86.test.mjs scripts/tests/skill-86-film-tools.test.mjs
        timeout-minutes: 15
