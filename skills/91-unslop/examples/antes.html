<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exemplo sintético — antes</title><style>
*{box-sizing:border-box}body{margin:0;background:#2c1647;color:white;font:16px system-ui}header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between}main{padding-top:45px}.box{border:1px solid #fa9cff;background:#6825b0;border-radius:28px;padding:25px;box-shadow:0 0 28px #c14bff;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}h1{font-size:38px;margin:0 0 16px}h2{font-size:15px;letter-spacing:.2em;text-transform:uppercase}button{background:#fc43bd;border:0;border-radius:30px;color:#fff;padding:16px;font-weight:bold}.muted{color:#e6ccf9}.number{font-size:34px;font-weight:800}.task{padding:10px;background:#943cc6;border-radius:22px;margin:8px 0}@media(max-width:650px){.stats{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><header><strong>◈ NORTE</strong><span>PAINEL ✨</span></header><main><div class="box"><h1>Seu trabalho, mais incrível!</h1><p class="muted">Tudo o que você precisa, em um lugar</p><button>Começar agora 🚀</button></div><div class="stats"><div class="box"><h2>Projetos ✨</h2><div class="number">8</div></div><div class="box"><h2>Concluídos 🔥</h2><div class="number">24</div></div><div class="box"><h2>Resultados ⚡</h2><div class="number">92%</div></div></div><div class="box"><h2>Atividades incríveis</h2><div class="task">Revisar orçamento</div><div class="task">Enviar proposta</div></div></main></body></html>
