<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exemplo sintético — depois</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f3ef;color:#202d29;font:16px/1.5 system-ui}header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;border-bottom:1px solid #d7ded8}.label{color:#52675c;font-size:14px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:36px 0 26px}h1{font-size:34px;line-height:1.2;margin:4px 0}h2{font-size:15px;margin:0 0 10px}.heading p{margin:0;color:#52675c}.button{background:#1f614b;border:1px solid #1f614b;border-radius:8px;color:white;padding:12px 18px;font-weight:600}.button:focus-visible{outline:3px solid #2d8867;outline-offset:3px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #d7ded8;border-radius:10px;padding:20px}.number{font-size:34px;font-weight:700;line-height:1.2}.tasks{margin-top:24px}.task{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e2e7e3;padding:14px 0}.task:last-child{padding-bottom:0}@media(max-width:650px){.stats{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}h1{font-size:28px}}
</style></head><body><header><strong>◈ NORTE</strong><span class="label">Visão geral</span></header><main><div class="heading"><div><span class="label">Espaço de trabalho</span><h1>Visão geral dos projetos</h1><p>Resumo e atividades para acompanhar</p></div><button class="button" type="button">Ver projetos</button></div><div class="stats"><section class="card"><h2>Projetos</h2><div class="number">8</div><span class="label">No espaço de trabalho</span></section><section class="card"><h2>Concluídos</h2><div class="number">24</div><span class="label">Período não informado</span></section><section class="card"><h2>Resultado</h2><div class="number">92%</div><span class="label">Critério não informado</span></section></div><section class="card tasks"><h2>Atividades</h2><div class="task"><span>Revisar orçamento</span><span class="label">Estado não informado</span></div><div class="task"><span>Enviar proposta</span><span class="label">Estado não informado</span></div></section></main></body></html>
