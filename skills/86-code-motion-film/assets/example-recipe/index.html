<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Receita de Negroni — filme em código</title>
<style>html,body{margin:0;background:#f6efe4;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Reproducao (nossa) do TIPO de peca "animacao de receita: do copo vazio ao drinque pronto", seguindo BRIEF.md.
// Tudo e funcao do tempo: window.seek(t) pinta o quadro exato. Sem relogio, sem timers, sem Math.random.
import { track, presets, layout, snapToBeat, progress, mix } from "/_lib/motion.mjs";

const q = new URLSearchParams(location.search);
const W = Number(q.get("w") || innerWidth), H = Number(q.get("h") || innerHeight);
const cv = document.getElementById("c"); cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");
const L = layout(W, H);

const BPM = 120, BEAT = 60 / BPM;
window.DURATION = 12; // 24 batidas
const T = (b) => snapToBeat(b * BEAT, BPM); // etapa em batidas -> segundos, travado na grade
const step = { title: T(0), ice: T(4), gin: T(8), campari: T(12), vermouth: T(16), stir: T(20), garnish: T(23) };

const PAPER = "#f6efe4", INK = "#1f1c19", RED = "#c8102e";
// cores entram como "#rrggbb" OU como [r,g,b] (misturas encadeadas): sem isso um array virava NaN e o canvas ignorava o fillStyle
const rgb = (c) => (Array.isArray(c) ? c : [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)));
const lerpC = (a, b, k) => rgb(a).map((v, i) => Math.round(mix(v, rgb(b)[i], k)));
const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---- copo (old fashioned): unidades u = 1% do lado menor
const G = { w: 30, h: 36, top: -16, r: 3 }; // largura/altura do copo e raio do fundo, em u; origem no centro do quadro
const glass = () => { const x = L.cx - (G.w / 2) * L.u, y = L.cy + G.top * L.u; return { x, y, w: G.w * L.u, h: G.h * L.u, r: G.r * L.u }; };

// ---- molas por papel
const POUR = 1.5; // s que cada pernada de liquido leva para encher
const lvl = (at) => track(0, [{ at, to: 1 }], { stiffness: 60, damping: 16, mass: 1 }); // nivel 0..1 de cada camada (assenta suave)
const gin = lvl(step.gin), campari = lvl(step.campari), vermouth = lvl(step.vermouth);
const mixK = track(0, [{ at: step.stir + 0.1, to: 1 }], { stiffness: 18, damping: 8, mass: 1 }); // camadas -> cor unica
const iceDrop = [0, 1, 2].map((i) => track(0, [{ at: step.ice + i * BEAT * 0.5, to: 1 }], presets.snappy));
const peel = track(0, [{ at: step.garnish, to: 1 }], presets.playful);
const titleA = track(1, [{ at: step.ice - 0.1, to: 0 }, { at: step.garnish + 0.2, to: 1 }], { stiffness: 900, damping: 60, mass: 1 }); // mola de texto rapida e critica
const glassIn = track(0, [{ at: 0, to: 1 }], presets.default);

// medidas: cada uma com a PROPRIA opacidade, em janelas que nao se sobrepoem
const LABELS = [
  { text: "30 ml", name: "GIN", at: step.gin + 0.2, until: step.campari - 0.15 },
  { text: "30 ml", name: "CAMPARI", at: step.campari + 0.2, until: step.vermouth - 0.15 },
  { text: "30 ml", name: "VERMUTE DOCE", at: step.vermouth + 0.2, until: step.stir - 0.15 },
].map((l) => ({ ...l, a: track(0, [{ at: l.at, to: 1 }, { at: l.until, to: 0 }], { stiffness: 900, damping: 60, mass: 1 }) }));
const CAPTIONS = [
  [step.ice, step.gin - 0.15, "gelo"], [step.stir, step.garnish - 0.15, "mexa 20 segundos"], [step.garnish + 0.3, 99, "casca de laranja"],
].map(([from, to, text]) => ({ text, a: track(0, [{ at: from + 0.1, to: 1 }, { at: to, to: 0 }], { stiffness: 900, damping: 60, mass: 1 }) }));

function roundTrapezoid(g, inset = 0) { // copo levemente afunilado
  const taper = 1.4 * L.u, x0 = g.x + inset, x1 = g.x + g.w - inset, y0 = g.y + inset, y1 = g.y + g.h - inset;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1 - taper, y1 - g.r); ctx.quadraticCurveTo(x1 - taper, y1, x1 - taper - g.r, y1); ctx.lineTo(x0 + taper + g.r, y1); ctx.quadraticCurveTo(x0 + taper, y1, x0 + taper, y1 - g.r); ctx.closePath();
}

window.seek = (t) => {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  const g = glass();
  const gA = glassIn(t);

  // ---- liquido (clip no interior do copo)
  ctx.save(); ctx.globalAlpha = gA;
  roundTrapezoid(g, 0.45 * L.u); ctx.clip();
  const innerH = g.h - 0.9 * L.u, bottom = g.y + g.h - 0.45 * L.u;
  const layers = [["#e9e3d3", gin(t)], [RED, campari(t)], ["#4a1d12", vermouth(t)]]; // gin claro, campari vermelho, vermute escuro
  const unit = innerH * 0.62 / 3; // 3 camadas somam 62% do copo
  const final = rgb("#b02a1c"); // cor da mistura: vermelho-laranja profundo (a media aritmetica das camadas dava um rosa-barro)
  const k = mixK(t);
  let yTop = bottom;
  for (const [i, [col, a]] of layers.entries()) {
    const h = unit * Math.max(0, Math.min(1, a));
    if (h <= 0) continue;
    const c = lerpC(col, "#000000", 0).map((v, j) => Math.round(mix(v, final[j], k)));
    ctx.fillStyle = css(c, 0.96); ctx.fillRect(g.x, yTop - h, g.w, h + 1);
    yTop -= h;
  }
  // jato: so enquanto a camada atual enche (coluna fina do topo ate a superficie)
  for (const [col, at] of [["#e9e3d3", step.gin], [RED, step.campari], ["#4a1d12", step.vermouth]]) {
    const p = progress(t, at, at + POUR * 0.55), out = progress(t, at + POUR * 0.55, at + POUR * 0.75);
    if (p > 0 && out < 1) { ctx.fillStyle = col; const w = 0.7 * L.u * (1 - out), x = L.cx - w / 2; ctx.fillRect(x, g.y - 6 * L.u * (1 - out), w, yTop - (g.y - 6 * L.u * (1 - out)) + 2); }
  }
  // colher: gira dentro do copo durante a etapa de mexer
  if (t >= step.stir && t < step.garnish + 0.1) {
    const s = progress(t, step.stir, step.garnish), ang = (t - step.stir) * 9.5;
    ctx.save(); ctx.globalAlpha = Math.min(1, s * 8) * Math.min(1, (1 - s) * 8);
    ctx.strokeStyle = INK; ctx.lineWidth = 0.55 * L.u; ctx.lineCap = "round";
    const sx = L.cx + Math.cos(ang) * 3.2 * L.u, sy = bottom - 3 * L.u;
    ctx.beginPath(); ctx.moveTo(L.cx + Math.cos(ang) * 6 * L.u, g.y - 6 * L.u); ctx.lineTo(sx, sy); ctx.stroke(); ctx.restore();
  }
  ctx.restore();

  // ---- gelo (cubos caem e assentam; posicoes fixas = determinismo)
  const cubes = [[-5, 0.0], [4, 0.0], [-0.5, 5.2]]; // x, altura acima do fundo em u (o terceiro cubo repousa SOBRE os outros dois)
  for (const [i, [cx, cy]] of cubes.entries()) {
    const a = iceDrop[i](t); if (a <= 0 && t < step.ice) continue;
    const s = 6.2 * L.u, rest = bottom - s - cy * L.u + 0.0, y = mix(g.y - 10 * L.u, rest - 1.2 * L.u, a), rot = (1 - a) * (i % 2 ? 0.6 : -0.5) + (i - 1) * 0.06;
    ctx.save(); ctx.translate(L.cx + cx * L.u, y + s / 2); ctx.rotate(rot); ctx.globalAlpha = Math.min(1, a * 3) * gA;
    ctx.fillStyle = "rgba(190,215,225,0.55)"; ctx.strokeStyle = "rgba(120,160,178,0.9)"; ctx.lineWidth = 0.35 * L.u;
    ctx.beginPath(); ctx.roundRect(-s / 2, -s / 2, s, s, 0.9 * L.u); ctx.fill(); ctx.stroke(); ctx.restore();
  }

  // ---- contorno do copo por cima (vidro)
  ctx.save(); ctx.globalAlpha = gA; ctx.strokeStyle = INK; ctx.lineWidth = 0.55 * L.u; ctx.lineJoin = "round";
  roundTrapezoid(g, 0); ctx.stroke(); ctx.restore();

  // ---- casca de laranja: arco que se desenha
  const pk = Math.min(1, peel(t));
  if (pk > 0) {
    ctx.save(); ctx.strokeStyle = "#e8841a"; ctx.lineWidth = 1.1 * L.u; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(g.x + g.w - 1.5 * L.u, g.y - 0.5 * L.u, 4.2 * L.u, Math.PI * 1.05, Math.PI * (1.05 + 0.95 * pk)); ctx.stroke(); ctx.restore();
  }

  // ---- medidas (uma de cada vez), ao lado direito do copo
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  for (const l of LABELS) {
    const a = Math.max(0, Math.min(1, l.a(t))); if (a < 0.01) continue;
    ctx.save(); ctx.globalAlpha = a; const x = g.x + g.w + 5 * L.u, y = L.cy - 1 * L.u + (1 - a) * 1.2 * L.u;
    ctx.fillStyle = RED; ctx.font = `600 ${7.2 * L.u}px system-ui, sans-serif`; ctx.fillText(l.text, x, y);
    ctx.fillStyle = INK; ctx.font = `600 ${2.2 * L.u}px system-ui, sans-serif`; ctx.fillText(l.name, x + 0.4 * L.u, y + 5.4 * L.u); ctx.restore();
  }
  // ---- legendas de etapa, abaixo do copo
  ctx.textAlign = "center";
  for (const c of CAPTIONS) {
    const a = Math.max(0, Math.min(1, c.a(t))); if (a < 0.01) continue;
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = INK; ctx.font = `400 ${3 * L.u}px system-ui, sans-serif`; ctx.fillText(c.text, L.cx, g.y + g.h + 6 * L.u); ctx.restore();
  }
  // ---- titulo: no comeco e de volta no fim
  const ta = Math.max(0, Math.min(1, titleA(t)));
  if (ta > 0.01) {
    ctx.save(); ctx.globalAlpha = ta; ctx.fillStyle = INK; ctx.font = `600 ${6.4 * L.u}px system-ui, sans-serif`; ctx.fillText("NEGRONI", L.cx, L.cy - 31 * L.u + (1 - ta) * 1.5 * L.u);
    ctx.fillStyle = RED; ctx.font = `400 ${2.4 * L.u}px system-ui, sans-serif`; ctx.fillText("gin · campari · vermute doce", L.cx, L.cy - 26 * L.u + (1 - ta) * 1.5 * L.u); ctx.restore();
  }
};
window.ready = Promise.resolve();
window.seek(0);
</script>
